name: ping

# 极简测试目标：验证「仓库自带 token 能否派发另一个 workflow」。
# 只 echo 一句就结束，不消耗编译时间。

on:
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: pong
        run: |
          echo "pong at $(date -u +%FT%TZ)"
          echo "triggered_by=${{ github.actor }}"
