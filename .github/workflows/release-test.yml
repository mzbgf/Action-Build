name: release-test

# 一次性验证：仓库自带 token 能不能创建 Release、上传附件、再删掉。
# 测完即删本文件。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 造一个测试附件
        run: echo "hello $(date -u +%FT%TZ)" > asset.txt

      - name: 建 Release 并上传附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="token-test-$(date -u +%Y%m%d%H%M%S)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "== 创建 $TAG"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "临时测试，用完即删" asset.txt
          echo "== 回读"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,assets --jq '"tag=\(.tagName) assets=\([.assets[].name]|join(","))"'

      - name: 删除 Release 与 tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          echo "== 已清理 $TAG"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 5 || true
