name: Weekly Kernel Update

# 每周一次：追平上游 → 刷新映射表（顺带）→ 读源码版本查表 → 触发两版编译 → 发 Release
# 判定只有一条：查表是否命中源码 SUBLEVEL。命中就发；不命中用表里最新一行编，但不发 Release。
# 表刷新是顺带动作，成败不影响发布判定；放前面只是让它本次补的行能参与本次匹配。
on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练：只追平上游 + 刷新表 + 查参数，不派发编译（默认关闭＝真编译）'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-kernel
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  MAP: state/kernel-map.json
  OTA_PREFIX: PHB110_11.H
  REGION: cn
  # 源码 SUBLEVEL 从这里读（一行 curl，不 clone）
  KSRC_MAKEFILE: https://raw.githubusercontent.com/OnePlusOSS/android_kernel_common_oneplus_sm8550/oneplus/sm8550_b_16.0.0_oneplus_11/Makefile
  # oplusrom 的机型目录：版本文件名列表，每个 .txt 里是一条直链
  OPLUSROM_DIR: https://github.com/chlink2025/oplusrom/tree/main/links/%E4%B8%80%E5%8A%A011
  OPLUSROM_RAW: https://raw.githubusercontent.com/chlink2025/oplusrom/main/links/%E4%B8%80%E5%8A%A011
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # ---- 17 项固定参数 ----
  P_FILE: oneplus_11_b
  P_SUSFS_CI: CI
  P_KPM: N/A
  P_DYNAMIC_REPO: Numbersf
  P_LZ4_UPDATE: true
  P_ZRAM: 1/lz4kd/8589934592
  P_FAST_BUILD: true
  P_LSM_BBG: true
  P_NETFILTER: true
  P_CCM: true
  P_UNICODE_BYPASS: true
  P_SCHED_HMBIRD: false
  P_DROID_SPACES: true
  P_RE_KERNEL: true
  P_SUSFS_DEV: false
  P_SPACE_NOCLEAN: false
  P_BUILD_NOCACHE: false

jobs:
  update:
    name: 追平 + 刷新表 + 查参数 + 派发 + 归档
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      suffix: ${{ steps.params.outputs.suffix }}
      build_time: ${{ steps.params.outputs.build_time }}
      sublevel: ${{ steps.params.outputs.sublevel }}
      version: ${{ steps.params.outputs.version }}
      mode: ${{ steps.params.outputs.mode }}
      src: ${{ steps.params.outputs.src }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 1. 追平上游（区分「已最新」和「真失败」） ----------
      - name: 追平上游
        id: sync
        run: |
          set -uo pipefail
          CONFLICT=0
          for b in BakaSU FinaSU; do
            echo "== 追平 $b"
            out=$(gh api -X POST "repos/$REPO/merge-upstream" -f branch="$b" 2>&1) && {
              echo "  成功: $out"
            } || {
              case "$out" in
                *"not behind"*|*"already up to date"*|*"up to date"*)
                  echo "  已是最新" ;;
                *conflict*|*Conflict*)
                  echo "::warning::$b 追平遇到冲突，本次沿用旧脚本构建"
                  CONFLICT=1 ;;
                *)
                  echo "::warning::$b 追平失败（非冲突）：$out"
                  CONFLICT=1 ;;
              esac
            }
          done
          echo "sync_conflict=$CONFLICT" >> "$GITHUB_OUTPUT"

      # ---------- 2. 取当前版本（tracker；oplusrom 里 16.x 的链接是 downloadCheck，缺参数取不到） ----------
      - name: 取当前版本
        id: current
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          mkdir -p work state
          python3 -m pip install --quiet requests cryptography || true
          git clone --depth 1 -q https://github.com/JerryTse-OSS/OPlus-Tracker.git ot 2>/dev/null || true
          python3 ot/tomboy_pro.py "$OTA_PREFIX" "$REGION" > work/ota.txt 2>&1 || true
          OV=$(grep -m1 -oP '(?<=• Version: ).*' work/ota.txt | sed 's/[[:space:]]*$//' || true)
          LINK=$(grep -m1 -oP '(?<=• Link: )\S+' work/ota.txt || true)
          echo "tracker 版本=${OV:-?} 链接=${LINK:0:70}"
          if [ -z "$LINK" ]; then echo "::warning::tracker 没给链接，跳过"; exit 0; fi
          case "$LINK" in
            *downloadCheck*) FINAL=$(curl -sI -H "userid: oplus-ota|" "$LINK" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2; exit}' || true) ;;
            *) FINAL="$LINK" ;;
          esac
          echo "直链头=${FINAL:0:70}"
          echo "直链尾=${FINAL: -70}"
          case "$FINAL" in http*) ;; *) echo "::warning::没解析出直链，跳过"; exit 0 ;; esac

          curl -fsSL -o work/pd.zip "https://github.com/rhythmcache/payload-dumper-rust/releases/download/payload-dumper-rust-v0.8.4/payload_dumper-linux-x86_64.zip" || true
          unzip -q -o work/pd.zip -d work/pd >/dev/null 2>&1 || true
          chmod +x work/pd/payload_dumper 2>/dev/null || true
          gh release download --repo topjohnwu/Magisk -p 'Magisk-*.apk' -D work --clobber >/dev/null 2>&1 || true
          unzip -q -o work/Magisk-*.apk 'lib/x86_64/libmagiskboot.so' -d work/mb >/dev/null 2>&1 || true
          chmod +x work/mb/lib/x86_64/libmagiskboot.so 2>/dev/null || true

          rm -rf work/cur; mkdir -p work/cur
          work/pd/payload_dumper --user-agent "payload-dumper/0.8.4" -i boot -o work/cur "$FINAL" > work/pd2.log 2>&1 || true
          if [ ! -f work/cur/boot.img ]; then echo "::warning::当前版本取 boot 失败：$(tail -1 work/pd2.log | cut -c1-140)"; exit 0; fi
          ( cd work/cur && ../mb/lib/x86_64/libmagiskboot.so unpack boot.img > ../mb2.log 2>&1 ) || true
          VER=$(grep -aoE '5\.15\.[0-9]+-android[0-9]+-8-o-[0-9]+-g[0-9a-f]+' work/cur/kernel 2>/dev/null | head -1 || true)
          BTN=$(grep -aoE 'SMP PREEMPT [A-Z][a-z]{2} [A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} UTC [0-9]{4}' work/cur/kernel 2>/dev/null | head -1 | sed 's/^SMP PREEMPT //' || true)
          if [ -z "$VER" ] || [ -z "$BTN" ]; then echo "::warning::当前版本没解出内核串"; exit 0; fi
          echo "当前版本内核串：$VER | $BTN"
          printf '%s\t%s\t%s\n' "${OV:-unknown}" "$VER" "$BTN" > work/new2.tsv
          python3 - <<'PY' || { echo "::error::写表失败"; exit 1; }
          import json, os, re, datetime
          def key(v):
              m = re.search(r'_(\d+)\.(\d+)\.(\d+)\.(\d+)', v)
              return [int(x) for x in m.groups()] if m else [0,0,0,0]
          p = os.environ['MAP']
          d = json.load(open(p)) if os.path.exists(p) else {'entries': []}
          E = {}
          for e in d.get('entries', []):
              e['version'] = re.sub(r'\.txt$', '', e['version'])
              E[e['version']] = e
          for line in open('work/new2.tsv'):
              parts = line.rstrip('\n').split('\t')
              if len(parts) != 3: continue
              ver, uts, bt = parts
              sub = re.search(r'^5\.15\.(\d+)', uts)
              E[ver] = {'version': ver, 'key': key(ver), 'uts': uts,
                        'sublevel': sub.group(1) if sub else '',
                        'suffix': re.sub(r'^[0-9.]+-android[0-9]+-', '', uts), 'build_time': bt,
                        'fetched_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}
          d['entries'] = sorted(E.values(), key=lambda e: e['key'], reverse=True)
          d['updated_at'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          json.dump(d, open(p,'w'), ensure_ascii=False, indent=2)
          print(f'表里现有 {len(d["entries"])} 版')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MAP"
          git diff --cached --quiet || { git commit -q -m "chore(map): 当前版本 $OV $(date -u +%F)"; git push -q; }

      # ---------- 3. 刷新映射表（顺带动作，失败不阻断） ----------
      # 抓 oplusrom 目录 → 数值排序 → 与表比对差集 → 逐版取直链、取 boot、解内核串 → 补行
      # 第一次跑差集等于全部，会下载十几个版本，之后差集通常为空
      - name: 刷新映射表
        id: refresh
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          mkdir -p work state

          # 2a. 版本列表（从目录页 HTML 里取文件名，去重）
          curl -sL --max-time 60 -A "Mozilla/5.0" "$OPLUSROM_DIR" -o work/dir.html || true
          grep -o '"name":"PHB110_[^"]*\.txt"' work/dir.html 2>/dev/null \
            | sed 's/.*"name":"//; s/"$//' | sort -u > work/versions.txt || true
          echo "目录里 $(wc -l < work/versions.txt) 个版本："
          cat work/versions.txt

          # 2b. 差集（表里没有的版本），按数值逐段降序
          python3 - <<'PY'
          import json, os, re
          vs = [l.strip() for l in open('work/versions.txt') if l.strip()]
          def key(v):
              m = re.search(r'_(\d+)\.(\d+)\.(\d+)\.(\d+)', v)
              return [int(x) for x in m.groups()] if m else [0,0,0,0]
          vs.sort(key=key, reverse=True)
          known = set()
          if os.path.exists(os.environ['MAP']):
              known = {e['version'] for e in json.load(open(os.environ['MAP'])).get('entries', [])}
          todo = [v for v in vs if (v[:-4] if v.endswith('.txt') else v) not in known]
          open('work/todo.txt','w').write('\n'.join(todo) + ('\n' if todo else ''))
          print(f'表里已有 {len(known)} 版，本轮待补 {len(todo)} 版')
          PY
          cat work/todo.txt

          # 2c. 工具（一次准备）
          if [ -s work/todo.txt ]; then
            curl -fsSL -o work/pd.zip "https://github.com/rhythmcache/payload-dumper-rust/releases/download/payload-dumper-rust-v0.8.4/payload_dumper-linux-x86_64.zip" || true
            unzip -q -o work/pd.zip -d work/pd >/dev/null 2>&1 || true
            chmod +x work/pd/payload_dumper 2>/dev/null || true
            gh release download --repo topjohnwu/Magisk -p 'Magisk-*.apk' -D work --clobber >/dev/null 2>&1 || true
            unzip -q -o work/Magisk-*.apk 'lib/x86_64/libmagiskboot.so' -d work/mb >/dev/null 2>&1 || true
            chmod +x work/mb/lib/x86_64/libmagiskboot.so 2>/dev/null || true
          fi

          # 2d. 逐版补行（单个失败只记一笔，不中断）
          : > work/new.tsv
          FAILED=0
          while read -r V; do
            [ -n "$V" ] || continue
            echo "===== $V"
            ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$V")
            URL=$(curl -s --max-time 40 "$OPLUSROM_RAW/$ENC" | head -1)
            case "$URL" in
              http*) ;;
              *) echo "::warning::$V 的 .txt 里没有链接"; FAILED=$((FAILED+1)); continue ;;
            esac
            # downloadCheck 是接口跳转：必须带 userid 头取 302 的 Location，那才是带签名的直链
            case "$URL" in
              *downloadCheck*)
                REAL=$(curl -sI --max-time 25 -H "userid: oplus-ota|" "$URL" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2; exit}')
                if [ -z "$REAL" ]; then echo "::warning::$V 没能解析出 302 目标"; FAILED=$((FAILED+1)); continue; fi
                URL="$REAL" ;;
            esac
            rm -rf work/boot; mkdir -p work/boot
            if ! work/pd/payload_dumper --user-agent "payload-dumper/0.8.4" -i boot -o work/boot "$URL" > work/pd.log 2>&1 || [ ! -f work/boot/boot.img ]; then
              echo "::warning::$V 取 boot 失败：$(tail -1 work/pd.log | cut -c1-160)"; FAILED=$((FAILED+1)); continue
            fi
            if ! ( cd work/boot && ../mb/lib/x86_64/libmagiskboot.so unpack boot.img > ../mb.log 2>&1 ) || [ ! -f work/boot/kernel ]; then
              echo "::warning::$V 解 boot 失败"; FAILED=$((FAILED+1)); continue
            fi
            VER=$(grep -aoE '5\.15\.[0-9]+-android[0-9]+-8-o-[0-9]+-g[0-9a-f]+' work/boot/kernel 2>/dev/null | head -1)
            BTN=$(grep -aoE 'SMP PREEMPT [A-Z][a-z]{2} [A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} UTC [0-9]{4}' work/boot/kernel 2>/dev/null | head -1 | sed 's/^SMP PREEMPT //')
            if [ -z "$VER" ] || [ -z "$BTN" ]; then
              echo "::warning::$V 没解出内核串"; FAILED=$((FAILED+1)); continue
            fi
            printf '%s\t%s\t%s\n' "${V%.txt}" "$VER" "$BTN" >> work/new.tsv
            echo "  读到 $VER | $BTN"
          done < work/todo.txt

          # 2e. 合并进表（按数值降序），有变化就提交
          python3 - <<'PY' || { echo "::error::写表失败"; exit 1; }
          import json, os, re, datetime
          def key(v):
              m = re.search(r'_(\d+)\.(\d+)\.(\d+)\.(\d+)', v)
              return [int(x) for x in m.groups()] if m else [0,0,0,0]
          p = os.environ['MAP']
          d = json.load(open(p)) if os.path.exists(p) else {'entries': []}
          E = {}
          for e in d.get('entries', []):
              e['version'] = re.sub(r'\.txt$', '', e['version'])
              E[e['version']] = e
          for line in open('work/new.tsv'):
              parts = line.rstrip('\n').split('\t')
              if len(parts) != 3: continue
              ver, uts, bt = parts
              suff = re.sub(r'^[0-9.]+-android[0-9]+-', '', uts)
              sub = re.search(r'^5\.15\.(\d+)', uts)
              E[ver] = {
                  'version': ver, 'key': key(ver), 'uts': uts,
                  'sublevel': sub.group(1) if sub else '',
                  'suffix': suff, 'build_time': bt,
                  'fetched_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              }
          d['entries'] = sorted(E.values(), key=lambda e: e['key'], reverse=True)
          d['updated_at'] = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          json.dump(d, open(p,'w'), ensure_ascii=False, indent=2)
          print(f'表里现有 {len(d["entries"])} 版')
          PY

          echo "本轮失败 $FAILED 版"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MAP"
          git diff --cached --quiet || { git commit -m "chore(map): 补 $(wc -l < work/new.tsv) 版 $(date -u +%F)"; git push; }

      # ---------- 3. 查表定参数（唯一的判定点） ----------
      - name: 读源码版本并查表
        id: params
        run: |
          set -uo pipefail
          mkdir -p work
          curl -s --max-time 40 "$KSRC_MAKEFILE" -o work/Makefile || true
          SRC=$(awk '/^SUBLEVEL/{print $3}' work/Makefile 2>/dev/null | tail -1)
          SRC="${SRC//[[:space:]]/}"
          echo "源码 SUBLEVEL=${SRC:-<空>}"
          if [ -z "$SRC" ]; then
            echo "::error::读不到源码 SUBLEVEL（Makefile 地址可能变了）"; exit 1
          fi
          if [ ! -s "$MAP" ]; then
            echo "::error::映射表为空或不存在，没有可用参数"; exit 1
          fi

          SRC="$SRC" python3 - <<'PY'
          import json, os
          src = os.environ['SRC']
          E = json.load(open(os.environ['MAP']))['entries']
          if not E:
              print('::error::表里没有任何版本'); raise SystemExit(1)
          cand = [e for e in E if e['sublevel'] == src]
          if cand:
              e = max(cand, key=lambda x: x['key']); mode = 'matched'
          else:
              e = max(E, key=lambda x: x['key']); mode = 'fallback'
          out = open(os.environ['GITHUB_OUTPUT'], 'a')
          for k, v in (('suffix', e['suffix']), ('build_time', e['build_time']),
                       ('sublevel', e['sublevel']), ('version', e['version']),
                       ('mode', mode), ('src', src)):
              out.write(f'{k}={v}\n')
          print(f"模式={mode} 版本={e['version']} SUBLEVEL={e['sublevel']} SUFFIX={e['suffix']} BUILD_TIME={e['build_time']}")
          if mode == 'fallback':
              print(f"::warning::源码 SUBLEVEL={src} 在表里没有对应版本，回落到 {e['version']}；本轮只编译不发布")
          PY

      # ---------- 4. 演练（只跑到查表） ----------
      - name: 触发两版编译（并行）
        if: env.DRY_RUN != 'true'
        run: |
          set -uo pipefail
          SUFFIX="${{ steps.params.outputs.suffix }}"
          BT="${{ steps.params.outputs.build_time }}"
          SUB="${{ steps.params.outputs.sublevel }}"
          : > runs.txt
          for b in BakaSU FinaSU; do
            if [ "$b" = "BakaSU" ]; then KSU="main/main/Numbersf/"; else KSU="master/dev/Numbersf/"; fi
            echo "== 派发 $b (KSU_META=$KSU)"
            gh workflow run "Build All OnePlus Kernels" --repo "$REPO" --ref "$b" \
              -f FILE=$P_FILE -f SUSFS_CI=$P_SUSFS_CI -f KPM=$P_KPM \
              -f DYNAMIC_REPO=$P_DYNAMIC_REPO -f BUILD_TIME="$BT" -f KSU_META="$KSU" \
              -f LZ4_UPDATE=$P_LZ4_UPDATE -f ZRAM=$P_ZRAM -f SUFFIX="$SUFFIX" -f RESUBLEVEL="$SUB" \
              -f FAST_BUILD=$P_FAST_BUILD -f LSM_BBG=$P_LSM_BBG -f NETFILTER=$P_NETFILTER \
              -f CCM=$P_CCM -f UNICODE_BYPASS=$P_UNICODE_BYPASS -f SCHED_HMBIRD=$P_SCHED_HMBIRD \
              -f DROID_SPACES=$P_DROID_SPACES -f RE_KERNEL=$P_RE_KERNEL -f SUSFS_DEV=$P_SUSFS_DEV \
              -f SPACE_NOCLEAN=$P_SPACE_NOCLEAN -f BUILD_NOCACHE=$P_BUILD_NOCACHE
            sleep 10
            ID=$(gh run list --repo "$REPO" --branch "$b" --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "$b=$ID" >> runs.txt
          done
          cat runs.txt

          PENDING=99
          for i in $(seq 1 100); do
            PENDING=0
            while read -r line; do
              id=${line##*=}
              st=$(gh run view "$id" --repo "$REPO" --json status --jq '.status' 2>/dev/null || echo unknown)
              [ "$st" = "completed" ] || PENDING=$((PENDING+1))
            done < runs.txt
            echo "[$i] 未完成: $PENDING"
            [ "$PENDING" -eq 0 ] && break
            sleep 45
          done
          if [ "$PENDING" -ne 0 ]; then
            echo "::error::等待超时，仍有构建未完成；不取产物、不发 Release"
            while read -r line; do echo "- ${line%%=*} → https://github.com/$REPO/actions/runs/${line##*=}"; done < runs.txt
            exit 1
          fi

          FAIL=0
          while read -r line; do
            b=${line%%=*}; id=${line##*=}
            CONC=$(gh run view "$id" --repo "$REPO" --json conclusion --jq '.conclusion')
            echo "== $b ($id) => $CONC"
            [ "$CONC" = "success" ] || { echo "::error::$b 构建失败"; FAIL=1; }
          done < runs.txt
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::有分支构建失败，本轮不发 Release"
            while read -r line; do echo "- ${line%%=*} → https://github.com/$REPO/actions/runs/${line##*=}"; done < runs.txt
            exit 1
          fi

          mkdir -p rel
          while read -r line; do
            b=${line%%=*}; id=${line##*=}
            gh api "repos/$REPO/actions/runs/$id/artifacts" --jq '.artifacts[]|"\(.id) \(.name)"' > arts.txt || true
            while read -r aid aname; do
              out="rel/${b}__${aname}.zip"
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$out" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$aid/zip" && echo "  取到 $out"
            done < arts.txt
          done < runs.txt
          ls -l rel || true

      # ---------- 6. 发 Release（只在命中时） ----------
      - name: 发 Release
        if: env.DRY_RUN != 'true' && steps.params.outputs.mode == 'matched'
        run: |
          set -uo pipefail
          TAG="kernel-$(date -u +%Y%m%d)"
          gh release create "$TAG" --repo "$REPO" --title "$TAG" \
            --notes "对应官方版本 ${{ steps.params.outputs.version }}；内核伪装 SUFFIX=${{ steps.params.outputs.suffix }} / BUILD_TIME=${{ steps.params.outputs.build_time }} / SUBLEVEL=${{ steps.params.outputs.sublevel }}；下载前请核对你手机的版本号是否一致。" \
            rel/*.zip || { echo "::error::Release 创建失败"; exit 1; }

      # ---------- 7. 未命中：产物留在 artifact，不发 Release ----------
      - name: 未命中说明
        if: env.DRY_RUN != 'true' && steps.params.outputs.mode != 'matched'
        run: |
          {
            echo "## 本轮未发布"
            echo
            echo "源码 SUBLEVEL 在表里没有对应版本，回落到表里最新一行：\`${{ steps.params.outputs.version }}\`"
            echo "该行的 SUBLEVEL 是 \`${{ steps.params.outputs.sublevel }}\`，与源码不符，版本号不可信，因此不发 Release。"
            echo "产物仍在本次 Actions 的 artifact 里，可手动取用。"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- 8. 状态 + 报告 ----------
      - name: 报告
        if: always()
        run: |
          set -uo pipefail
          N=$(python3 -c "import json;print(len(json.load(open('$MAP'))['entries']))" 2>/dev/null || echo 0)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            RESULT="演练：已追平、已刷新表、已查参数，未派发编译"
          elif [ "${{ steps.params.outputs.mode }}" = "matched" ]; then
            RESULT="已发布（命中表里的官方版本）"
          else
            RESULT="未发布：源码版本在表里没有对应行，产物只留在 artifact"
          fi
          {
            echo "## 每周内核构建 $(date -u +%F)"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 判定 | \`${{ steps.params.outputs.mode }}\` |"
            echo "| 命中版本 | \`${{ steps.params.outputs.version }}\` |"
            echo "| 源码 SUBLEVEL | \`${{ steps.params.outputs.src }}\` |"
            echo "| 伪装 SUFFIX | \`${{ steps.params.outputs.suffix }}\` |"
            echo "| BUILD_TIME | \`${{ steps.params.outputs.build_time }}\` |"
            echo "| RESUBLEVEL | \`${{ steps.params.outputs.sublevel }}\` |"
            echo "| 表中版本数 | $N |"
            echo "| 表刷新 | ${{ steps.refresh.outcome }} |"
            echo "| 追平冲突 | ${{ steps.sync.outputs.sync_conflict }} |"
            echo "| 本轮结果 | $RESULT |"
            echo
            echo "构建 run："
            if [ -f runs.txt ]; then
              while read -r line; do echo "- \`$line\` → https://github.com/$REPO/actions/runs/${line##*=}"; done < runs.txt
            else
              echo "- （未派发）"
            fi
            echo
            echo "产物："
            ls -1 rel 2>/dev/null | sed 's/^/- /' || echo "- （无）"
          } >> "$GITHUB_STEP_SUMMARY"
