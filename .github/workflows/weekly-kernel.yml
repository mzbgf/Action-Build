name: Weekly Kernel Update

# 每周一次：追平上游 → 读官方内核版本串 → 触发两版编译 → 发 Release
# 设计约定：
#   1. 官方内核版本串变了才改伪装参数（SUFFIX / BUILD_TIME / RESUBLEVEL），其余 18 项固定
#   2. 读不到官方内核串时沿用上次参数，不中断
#   3. 失败不发邮件轰炸，只在失败时开一个 issue

on:
  schedule:
    # 每周日 18:00 UTC = 每周一 02:00 北京时间
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练模式：只派发 ping 验证链路，不触发真实编译'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: weekly-kernel
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  OTA_PREFIX: PHB110_11.H
  REGION: cn
  STATE: state/kernel-state.json
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # ---- 18 项固定参数（与手工填的那套一致）----
  P_FILE: oneplus_11_b
  P_SUSFS_CI: CI
  P_KPM: N/A
  P_DYNAMIC_REPO: Numbersf
  P_LZ4_UPDATE: true
  P_ZRAM: 1/lz4kd/8589934592
  P_FAST_BUILD: true
  P_LSM_BBG: true
  P_NETFILTER: true
  P_CCM: true
  P_UNICODE_BYPASS: true
  P_SCHED_HMBIRD: false
  P_DROID_SPACES: true
  P_RE_KERNEL: true
  P_SUSFS_DEV: false
  P_SPACE_NOCLEAN: false
  P_BUILD_NOCACHE: false

jobs:
  update:
    name: 追平上游 + 读内核串 + 触发编译
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      suffix: ${{ steps.params.outputs.suffix }}
      build_time: ${{ steps.params.outputs.build_time }}
      sublevel: ${{ steps.params.outputs.sublevel }}
      ota_version: ${{ steps.params.outputs.ota_version }}
      params_changed: ${{ steps.params.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 1. 追平上游（纯快进，失败不中断） ----------
      - name: 追平上游 BakaSU / FinaSU
        run: |
          set -uo pipefail
          for b in BakaSU FinaSU; do
            echo "== 追平 $b"
            out=$(gh api -X POST "repos/$REPO/merge-upstream" -f branch="$b" 2>&1) && {
              echo "  $out"
            } || {
              echo "  未追平（继续）: $out"
            }
          done

      # ---------- 2. 查官方 OTA 版本 ----------
      - name: 查官方 OTA 版本
        run: |
          set -uo pipefail
          python3 -m pip install --quiet requests cryptography
          git clone --depth 1 -q https://github.com/JerryTse-OSS/OPlus-Tracker.git ot
          python3 ot/tomboy_pro.py "$OTA_PREFIX" "$REGION" > ota.txt 2>&1 || true
          sed -n '1,30p' ota.txt
          if ! grep -q '• Link:' ota.txt; then
            echo "::warning::没查到 OTA 链接，本轮沿用上次参数"
          fi

      # ---------- 3. 决定伪装参数 ----------
      - name: 决定伪装参数
        id: params
        run: |
          set -uo pipefail
          NEW_OTA=$(grep -m1 -oP '(?<=• Version: ).*' ota.txt | sed 's/[[:space:]]*$//' || true)
          OLD_OTA=$(python3 -c "import json;print(json.load(open('$STATE')).get('ota_version',''))" 2>/dev/null || echo "")
          echo "旧: $OLD_OTA / 新: $NEW_OTA"

          read_state() { python3 -c "import json,sys;d=json.load(open('$STATE'));print(d['spoof'].get('$1',''))" 2>/dev/null || echo ""; }
          SUFFIX=$(read_state SUFFIX); BT=$(read_state BUILD_TIME); SUB=$(read_state RESUBLEVEL)
          CHANGED=false

          if [ -n "$NEW_OTA" ] && [ "$NEW_OTA" != "$OLD_OTA" ]; then
            echo "== 官方版本变了，尝试读内核串"
            URL=$(grep -m1 -oP '(?<=• Link: )\S+' ota.txt || true)
            if [ -n "$URL" ]; then
              gh release download payload-dumper-rust-v0.8.4 --repo rhythmcache/payload-dumper-rust \
                 -p 'payload_dumper-linux-x86_64.zip' -D tools --clobber || true
              unzip -q -o tools/payload_dumper-linux-x86_64.zip -d tools/pd || true
              chmod +x tools/pd/payload_dumper || true
              tools/pd/payload_dumper -i boot -o ota "$URL" || echo "::warning::取 boot 失败"
              gh release download --repo topjohnwu/Magisk -p 'Magisk-*.apk' -D tools --clobber || true
              unzip -q -o tools/Magisk-*.apk 'lib/x86_64/libmagiskboot.so' -d tools/mb || true
              chmod +x tools/mb/lib/x86_64/libmagiskboot.so || true
              ( cd ota && ../tools/mb/lib/x86_64/libmagiskboot.so unpack boot.img ) || echo "::warning::解 boot 失败"
              VER=$(grep -aoE '5\.15\.[0-9]+-android[0-9]+-8-o-[0-9]+-g[0-9a-f]+' ota/kernel 2>/dev/null | head -1)
              BTN=$(grep -aoE 'SMP PREEMPT [A-Z][a-z]{2} [A-Z][a-z]{2} +[0-9]{1,2} [0-9:]{8} UTC [0-9]{4}' ota/kernel 2>/dev/null | head -1 | sed 's/^SMP PREEMPT //')
              echo "读到: $VER | $BTN"
              if [ -n "$VER" ] && [ -n "$BTN" ]; then
                SUFFIX=$(echo "$VER" | sed -E 's/^[0-9.]+-android[0-9]+-//')
                SUB=$(echo "$VER" | sed -E 's/^5\.15\.([0-9]+).*/\1/')
                BT="$BTN"
                CHANGED=true
              else
                echo "::warning::没读到内核串，沿用上次参数"
                NEW_OTA="$OLD_OTA"
              fi
            else
              echo "::warning::没有可用链接，沿用上次参数"
              NEW_OTA="$OLD_OTA"
            fi
          fi

          echo "== 本轮使用: SUFFIX=$SUFFIX BUILD_TIME=$BT RESUBLEVEL=$SUB"
          {
            echo "suffix=$SUFFIX"
            echo "build_time=$BT"
            echo "sublevel=$SUB"
            echo "ota_version=${NEW_OTA:-$OLD_OTA}"
            echo "changed=$CHANGED"
          } >> "$GITHUB_OUTPUT"

      # ---------- 4. 演练：只派发 ping ----------
      - name: 演练（派发 ping）
        if: env.DRY_RUN == 'true'
        run: |
          set -uo pipefail
          gh workflow run ping.yml --repo "$REPO" --ref "${GITHUB_REF_NAME}"
          sleep 20
          ID=$(gh run list --repo "$REPO" --workflow ping.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "ping run: $ID"
          gh run watch "$ID" --repo "$REPO" --exit-status --interval 10
          echo "派发链路可用 ✅"

      # ---------- 5. 真实派发 + 等构建 + 发 Release ----------
      - name: 触发两版编译并归档
        if: env.DRY_RUN != 'true'
        run: |
          set -uo pipefail
          SUFFIX="${{ steps.params.outputs.suffix }}"
          BT="${{ steps.params.outputs.build_time }}"
          SUB="${{ steps.params.outputs.sublevel }}"
          : > runs.txt
          for b in BakaSU FinaSU; do
            if [ "$b" = "BakaSU" ]; then KSU="main/main/Numbersf/"; else KSU="master/master/Numbersf/"; fi
            echo "== 派发 $b"
            gh workflow run "Build All OnePlus Kernels" --repo "$REPO" --ref "$b" \
              -f FILE=$P_FILE -f SUSFS_CI=$P_SUSFS_CI -f KPM=$P_KPM -f SUSFS_META= \
              -f DYNAMIC_REPO=$P_DYNAMIC_REPO -f BUILD_TIME="$BT" -f KSU_META="$KSU" \
              -f LZ4_UPDATE=$P_LZ4_UPDATE -f ZRAM=$P_ZRAM -f SUFFIX="$SUFFIX" -f RESUBLEVEL="$SUB" \
              -f FAST_BUILD=$P_FAST_BUILD -f LSM_BBG=$P_LSM_BBG -f NETFILTER=$P_NETFILTER \
              -f CCM=$P_CCM -f UNICODE_BYPASS=$P_UNICODE_BYPASS -f SCHED_HMBIRD=$P_SCHED_HMBIRD \
              -f DROID_SPACES=$P_DROID_SPACES -f RE_KERNEL=$P_RE_KERNEL -f SUSFS_DEV=$P_SUSFS_DEV \
              -f SPACE_NOCLEAN=$P_SPACE_NOCLEAN -f BUILD_NOCACHE=$P_BUILD_NOCACHE
            sleep 12
            ID=$(gh run list --repo "$REPO" --branch "$b" --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "$b=$ID" >> runs.txt
          done
          cat runs.txt

          FAIL=0
          while read -r line; do
            b=${line%%=*}; id=${line##*=}
            echo "== 等待 $b ($id)"
            gh run watch "$id" --repo "$REPO" --exit-status --interval 60 || { echo "::error::$b 构建失败"; FAIL=1; }
            gh run download "$id" --repo "$REPO" -D "artifacts/$b" || true
          done < runs.txt
          ls -R artifacts || true

          TAG="kernel-$(date -u +%Y%m%d)"
          gh release create "$TAG" --repo "$REPO" --title "$TAG" \
            --notes "自动构建：参数 $SUFFIX / $BT / SUBLEVEL=$SUB；OTA=${NEW_OTA:-未知}" \
            $(find artifacts -name '*.zip') || echo "::warning::Release 创建失败"
          [ "$FAIL" = "0" ] || exit 1

      # ---------- 6. 更新状态记录 ----------
      - name: 更新状态记录
        if: env.DRY_RUN != 'true' && success()
        run: |
          mkdir -p state
          python3 - <<'PY'
          import json, os, subprocess, datetime
          p = 'state/kernel-state.json'
          d = json.load(open(p)) if os.path.exists(p) else {}
          d['updated_at'] = datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ')
          d['ota_version'] = os.environ.get('OTA_VER', '')
          d['spoof'] = {
              'SUFFIX': os.environ.get('SUF', ''),
              'BUILD_TIME': os.environ.get('BT', ''),
              'RESUBLEVEL': os.environ.get('SUB', ''),
          }
          json.dump(d, open(p, 'w'), ensure_ascii=False, indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/kernel-state.json
          git diff --cached --quiet || { git commit -m "chore(state): 每周快照 $(date -u +%F)"; git push; }
        env:
          OTA_VER: ${{ steps.params.outputs.ota_version }}
          SUF: ${{ steps.params.outputs.suffix }}
          BT: ${{ steps.params.outputs.build_time }}
          SUB: ${{ steps.params.outputs.sublevel }}

  notify:
    name: 失败时开 issue
    needs: update
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 开 issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "每周内核任务失败 $(date -u +%F)" \
            --body "运行记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
